jdk:
  - openjdk21
before_install:
  - sdk install maven 3.9.9
  - sdk use maven 3.9.9
install:
  - echo "MAVEN_HOME=$MAVEN_HOME"
  - echo "PATH=$PATH"
  - which -a mvn
  - ls -la "$MAVEN_HOME/boot"
  - bash -x "$(which mvn)" -v 2>&1 | tail -40
  - java -cp "$HOME/.sdkman/candidates/maven/3.9.9/boot/plexus-classworlds-2.8.0.jar" org.codehaus.plexus.classworlds.launcher.Launcher --version